name: auto_Reserve

on:
  schedule:
    - cron: "30 21 * * 0,1,2,3,4,5,6" # 每天 05:30 启动（周一到周日）
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 强制用Node24，消除警告
    steps:
      - uses: actions/checkout@v5  # 最新版，无警告
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          
      - name: install dependency
        run: |
          python -m pip install --upgrade pip
          sudo apt-get install build-essential libssl-dev libffi-dev python3-dev -y
          pip install cryptography requests opencv-python

      - name: run script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          python main.py -m debug --action
